<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User Management | Sweet Symphony v0.9.2</title><link rel="stylesheet" href="styles.css?v=0.9.8.2"></head><body><header class="wrap admin-header"><a href="index.html" class="admin-brand"><img src="assets/logo.svg" alt="Sweet Symphony"></a><span>User Management <small>v0.9.2</small></span><nav id="role-nav" class="role-nav"></nav><button id="sign-out" class="btn secondary" hidden>Sign out</button></header><main class="wrap admin-main"><section id="admin-login" class="admin-login"><div class="eyebrow">PRIVATE ACCESS</div><h1>User Management</h1><p>Sign in with an authorized Google account.</p><button class="btn google-button" id="google-sign-in"><span class="google-g">G</span> CONTINUE WITH GOOGLE</button><p id="login-message" role="status"></p></section><section id="admin-panel" hidden><div class="admin-heading"><div><div class="eyebrow">SWEET SYMPHONY</div><h1>User Management</h1></div></div><div class="admin-split"><form id="user-form" class="admin-card"><h2>Assign access</h2><p>Users must first sign in with Google to create their Firebase Authentication UID.</p><label>Firebase UID<input id="user-uid" required placeholder="Paste UID from Firebase Authentication"></label><label>Google email (reference only)<input id="user-email" type="email" required></label><label>Role<select id="user-role"><option value="website_manager">Website Manager</option><option value="order_manager">Order Manager</option><option value="super_admin">Super Admin</option></select></label><label><input type="checkbox" id="user-enabled" checked> Enabled</label><button class="btn">SAVE USER</button><p id="user-status" role="status"></p></form><div class="admin-card"><h2>Registered users</h2><div id="user-list"></div></div></div></section></main><script type="module" src="users.js"></script></body></html>
